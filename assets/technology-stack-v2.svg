<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Kenny Richardson Technology Stack</title>
  <desc id="desc">A readable, stylish technology stack dashboard with large technology names and custom crimson interface icons.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07080A"/>
      <stop offset=".48" stop-color="#111318"/>
      <stop offset="1" stop-color="#07080A"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5D0A1A" stop-opacity="0"/>
      <stop offset=".2" stop-color="#9B1C31"/>
      <stop offset=".5" stop-color="#FF3154"/>
      <stop offset=".8" stop-color="#9B1C31"/>
      <stop offset="1" stop-color="#5D0A1A" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cardTop" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4D0A18"/>
      <stop offset=".5" stop-color="#FF3154"/>
      <stop offset="1" stop-color="#4D0A18"/>
    </linearGradient>

    <radialGradient id="ambient">
      <stop stop-color="#FF3154" stop-opacity=".12"/>
      <stop offset="1" stop-color="#FF3154" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity=".025"/>
    </pattern>

    <pattern id="microGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" stroke="#FF3154" stroke-opacity=".025"/>
    </pattern>
  </defs>

  <rect width="1400" height="980" rx="26" fill="url(#bg)"/>
  <rect width="1400" height="980" rx="26" fill="url(#grid)"/>
  <rect width="1400" height="980" rx="26" fill="url(#microGrid)" opacity=".3"/>

  <ellipse cx="700" cy="380" rx="620" ry="450" fill="url(#ambient)"/>

  <!-- HEADER -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="58" y="62" fill="#F4F5F7" font-size="30" font-weight="750" letter-spacing="3">
      TECHNOLOGY STACK
    </text>
    <text x="60" y="89" fill="#777B83" font-size="11" font-weight="600" letter-spacing="4">
      AI ENGINEERING · SOFTWARE · INFRASTRUCTURE · DEPLOYMENT
    </text>

    <text x="1340" y="61" text-anchor="end" fill="#686C74" font-family="Courier New, monospace" font-size="10" letter-spacing="2">
      STACK // 2026
    </text>
    <circle cx="1350" cy="57" r="4" fill="#FF3154" filter="url(#glow)">
      <animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="55" y="108" width="1290" height="2" fill="url(#edge)"/>

  <!-- CATEGORY HELPER STYLE:
       icon box | LARGE NAME | smaller descriptor -->

