<svg
  width="1200"
  height="52"
  viewBox="0 0 1200 52"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>

    <linearGradient id="divider" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#4A0712" stop-opacity="0"/>
      <stop offset="12%" stop-color="#8E1028"/>
      <stop offset="35%" stop-color="#D51F43"/>
      <stop offset="50%" stop-color="#FF3154"/>
      <stop offset="65%" stop-color="#D51F43"/>
      <stop offset="88%" stop-color="#8E1028"/>
      <stop offset="100%" stop-color="#4A0712" stop-opacity="0"/>
    </linearGradient>

    <filter
      id="glow"
      x="-20%"
      y="-300%"
      width="140%"
      height="700%"
    >
      <feGaussianBlur
        stdDeviation="5"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Ambient glow -->
  <rect
    x="90"
    y="23"
    width="1020"
    height="6"
    rx="3"
    fill="#C91D3D"
    opacity="0.18"
    filter="url(#glow)"
  />

  <!-- Main divider -->
  <rect
    x="90"
    y="24"
    width="1020"
    height="4"
    rx="2"
    fill="url(#divider)"
  />

  <!-- Bright core -->
  <rect
    x="250"
    y="25"
    width="700"
    height="2"
    rx="1"
    fill="#FF3154"
    opacity="0.85"
  />

  <!-- Left terminal -->
  <rect
    x="90"
    y="20"
    width="8"
    height="12"
    rx="2"
    fill="#FF3154"
    filter="url(#glow)"
  />

  <circle
    cx="90"
    cy="26"
    r="3"
    fill="#FF3154"
  />

  <!-- Right terminal -->
  <rect
    x="1102"
    y="20"
    width="8"
    height="12"
    rx="2"
    fill="#FF3154"
    filter="url(#glow)"
  />

  <circle
    cx="1110"
    cy="26"
    r="3"
    fill="#FF3154"
  />

  <!-- Circuit branches -->
  <path
    d="M170 26 V13 H205"
    stroke="#B1122D"
    stroke-width="2"
    opacity="0.65"
  />

  <path
    d="M1030 26 V39 H995"
    stroke="#B1122D"
    stroke-width="2"
    opacity="0.65"
  />

  <circle
    cx="205"
    cy="13"
    r="3"
    fill="#FF3154"
    filter="url(#glow)"
  />

  <circle
    cx="995"
    cy="39"
    r="3"
    fill="#FF3154"
    filter="url(#glow)"
  />

  <!-- Moving energy pulse -->
  <circle
    cx="100"
    cy="26"
    r="4"
    fill="#FFFFFF"
    filter="url(#glow)"
  >
    <animate
      attributeName="cx"
      values="100;1100;100"
      dur="5s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0;1;1;0"
      dur="5s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- Center reactor -->
  <circle
    cx="600"
    cy="26"
    r="6"
    fill="#090A0C"
    stroke="#FF3154"
    stroke-width="2"
    filter="url(#glow)"
  />

  <circle
    cx="600"
    cy="26"
    r="2.5"
    fill="#FF3154"
  >
    <animate
      attributeName="r"
      values="2;4;2"
      dur="2s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0.5;1;0.5"
      dur="2s"
      repeatCount="indefinite"
    />
  </circle>

</svg>    