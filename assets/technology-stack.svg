<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Kenny Richardson Technology Stack</title>
  <desc id="desc">Custom crimson-on-dark technology stack visualization covering languages, AI, application engineering, data, infrastructure, simulation and deployment.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090A0D"/>
      <stop offset="0.5" stop-color="#101216"/>
      <stop offset="1" stop-color="#090A0D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6E0C20"/>
      <stop offset=".5" stop-color="#FF3154"/>
      <stop offset="1" stop-color="#6E0C20"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#17191E"/>
      <stop offset="1" stop-color="#0D0F12"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#FF3154" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FF3154" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowFilter" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#fff" stroke-opacity=".025"/>
    </pattern>
  </defs>

  <rect width="1200" height="920" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="920" rx="22" fill="url(#grid)"/>
  <ellipse cx="600" cy="430" rx="550" ry="450" fill="url(#glow)"/>

  <text x="52" y="54" fill="#F2F3F5" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="2">TECHNOLOGY // STACK</text>
  <text x="52" y="80" fill="#777B83" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="3">TOOLS, SYSTEMS &amp; ENGINEERING CAPABILITIES</text>
  <circle cx="1145" cy="48" r="5" fill="#FF3154" filter="url(#glowFilter)">
    <animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/>
  </circle>

