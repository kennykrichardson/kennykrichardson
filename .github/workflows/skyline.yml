name: Generate Contribution Skyline

on:
  schedule:
    # Run once every day.
    # 18:30 UTC = 00:00 IST
    - cron: "30 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Build 3D Contribution Skyline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5

      - name: Generate 3D contribution profile
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated skyline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-3d-contrib/

          if git diff --cached --quiet; then
            echo "No skyline changes detected."
          else
            git commit -m "chore: update contribution skyline"
            git push
          fi