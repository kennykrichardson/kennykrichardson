name: Generate Developer Metrics

on:
  schedule:
    # Run every day at 00:30 UTC
    # 06:00 IST
    - cron: "30 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    name: Build GitHub Developer Metrics
    runs-on: ubuntu-latest

    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          filename: generated/metrics.svg

          user: kennykrichardson

          # ---------------------------------
          # Core profile information
          # ---------------------------------

          base: header, activity, community, repositories, metadata

          config_timezone: Asia/Kolkata

          config_display: large

          # ---------------------------------
          # Visual style
          # ---------------------------------

          config_padding: 0, 8

          config_order: base, isocalendar, languages, habits, lines, repositories, achievements

          # ---------------------------------
          # Isometric contribution calendar
          # ---------------------------------

          plugin_isocalendar: yes

          plugin_isocalendar_duration: full-year

          # ---------------------------------
          # Languages
          # ---------------------------------

          plugin_languages: yes

          plugin_languages_ignored: html, css

          plugin_languages_limit: 8

          plugin_languages_sections: most-used, recently-used

          plugin_languages_details: bytes-size, percentage

          plugin_languages_threshold: 2

          # ---------------------------------
          # Coding habits
          # ---------------------------------

          plugin_habits: yes

          plugin_habits_from: 200

          plugin_habits_days: 14

          plugin_habits_charts: yes

          # ---------------------------------
          # Lines changed
          # ---------------------------------

          plugin_lines: yes

          plugin_lines_sections: base, repositories

          plugin_lines_repositories_limit: 4

          plugin_lines_history_limit: 1

          # ---------------------------------
          # Repository information
          # ---------------------------------

          plugin_repositories: yes

          plugin_repositories_featured: kennykrichardson/orzyn, kennykrichardson/nyxora, kennykrichardson/habryn, kennykrichardson/quartly

          plugin_repositories_pinned: yes

          # ---------------------------------
          # Achievements
          # ---------------------------------

          plugin_achievements: yes

          plugin_achievements_threshold: C

          # ---------------------------------
          # Rendering
          # ---------------------------------

          plugins_errors_fatal: no

          output_action: commit